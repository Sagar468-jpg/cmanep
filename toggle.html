<!DOCTYPE html>
<html>
<head>
<style>
.canvas-container {
border: 2px solid black;
width: 200px;
height: 200px;
display: flex;
justify-content: center;
align-items: center;
border-radius: 20px;
background-color: blue;
margin-bottom: 10px;
}
</style>

</head>
<body>
<div class="canvas-container">
<canvas id="faceCanvas" width="150" height="150">
</canvas>
</div>
<button onclick="toggleFace()">Toggle Face</button>
<script>
var canvas = document.getElementById("faceCanvas");
var ctx = canvas.getContext("2d");
var isSmiling=false;

// Function to draw a smiling face
function drawnoseeyes()
{
//draw circle
ctx.beginPath();
ctx.arc(75,75,70,0,Math.PI*2);
ctx.fillStyle="yellow";
ctx.fill();

//draw eyes
ctx.beginPath();
ctx.moveTo(35,55);
ctx.quadraticCurveTo(50,30,65,55);
ctx.strokeStyle="#000";
ctx.lineWidth=5;
ctx.stroke();

ctx.beginPath();
ctx.moveTo(90,55);
ctx.quadraticCurveTo(105,30,120,55);
ctx.strokeStyle="#000";
ctx.lineWidth=4;
ctx.stroke();

//draw nose
ctx.beginPath();
ctx.moveTo(80,70);
ctx.quadraticCurveTo(60,77,80,85);
ctx.strokeStyle="#000";
ctx.lineWidth=4;
ctx.stroke();
}


function drawSmile() {
drawnoseeyes()
//draw lips
ctx.beginPath();
ctx.moveTo(40,100);
ctx.quadraticCurveTo(75,155,110,100);
ctx.strokeStyle="#000";
ctx.lineWidth=4;
ctx.stroke();
}

// Function to draw a sad face
function drawSad() {
    drawnoseeyes()
//draw lips
ctx.beginPath();
ctx.moveTo(40,120);
ctx.quadraticCurveTo(75,80,110,120);
ctx.strokeStyle="#000";
ctx.lineWidth=4;
ctx.stroke();
}
// Function to toggle between the smiling and sad face
function toggleFace() {
if(isSmiling) {
drawSad();
isSmiling = false;
}
else {
drawSmile();
isSmiling = true;
}
}

// Initial drawing of the smiling face
drawSmile();
</script>
</body>
</html>
